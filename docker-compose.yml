version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: screensaver-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-screensaver}
      POSTGRES_USER: ${DB_USER:-screensaver_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-screensaver_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: screensaver-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-9090}:${BACKEND_PORT:-9090}"
    environment:
      - DB_HOST=${DB_IP:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-screensaver}
      - DB_USER=${DB_USER:-screensaver_user}
      - DB_PASSWORD=${DB_PASSWORD:-screensaver_pass}
      - BACKEND_PORT=${BACKEND_PORT:-9090}
      - SYNOLOGY_IP=${SYNOLOGY_IP:-localhost}
      - SYNOLOGY_PORT=${SYNOLOGY_PORT:-9092}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: screensaver-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - BACKEND_URL=http://${BACKEND_IP:-localhost}:${BACKEND_PORT:-9090}
      - SYNOLOGY_URL=http://${SYNOLOGY_IP:-localhost}:${SYNOLOGY_PORT:-9092}
      - API_KEY=${API_KEY:-my_secure_screensaver_key}
    volumes:
      # Mount the local frontend directory for real-time adjustments
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  postgres_data:

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: screensaver-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-screensaver}
      POSTGRES_USER: ${DB_USER:-screensaver_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-screensaver_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: screensaver-backend
    restart: always
    ports:
      - "9091:9091"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-screensaver}
      - DB_USER=${DB_USER:-screensaver_user}
      - DB_PASSWORD=${DB_PASSWORD:-screensaver_pass}
      - PORT=9091
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: screensaver-frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      # Mount the local frontend directory for real-time adjustments
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  postgres_data:
